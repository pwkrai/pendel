<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pendel</title>
  <meta name="description" content="Meine festen Bahnstrecken mit einem Tipp abfragen">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pendel">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-back" aria-label="Zurück" hidden>‹</button>
    <h1 id="title">Pendel</h1>
    <button class="icon-btn" id="btn-refresh" aria-label="Aktualisieren" hidden>↻</button>
    <button class="icon-btn" id="btn-manage" aria-label="Strecken verwalten">✎</button>
  </header>
  <div id="ptr" class="ptr" aria-hidden="true"><span>↓ Zum Aktualisieren ziehen</span></div>
  <main id="view"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
